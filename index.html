<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary shadow-sm fw-bold px-4">
        <span class="navbar-brand mb-0 h1">My To-Do List</span>
    </nav>

    <!-- Main Container -->
    <div class="container my-5" style="max-width: 650px;">
        <div class="card shadow border-0 p-4 rounded-4">
            
            <!-- Page Heading -->
            <div class="text-center mb-4">
                <h2 class="fw-bold">Task Manager</h2>
                <p class="text-muted">Organize your tasks and stay productive</p>
            </div>

            <!-- Task Input Field & Add Button -->
            <div class="input-group mb-2">
                <input type="text" id="taskInput" class="form-control form-control-lg" placeholder="Enter a new task..." aria-label="Enter a new task">
                <button class="btn btn-primary px-4 fw-semibold" id="addTaskBtn" type="button">Add Task</button>
            </div>
            <!-- Error Message Alert -->
            <div id="errorMessage" class="text-danger small mb-3 d-none">Please enter a valid task!</div>

            <!-- Header Info & Task Counter -->
            <div class="d-flex justify-content-between align-items-center mt-3 mb-2">
                <span class="fw-bold text-secondary">Your tasks</span>
                <span class="badge bg-primary rounded-pill fs-6 px-3 py-2" id="taskCounter">0 remaining</span>
            </div>

            <!-- Filter Buttons -->
            <div class="btn-group w-100 mb-3" role="group" aria-label="Task Filters">
                <button type="button" class="btn btn-outline-primary filter-btn active" data-filter="all">All</button>
                <button type="button" class="btn btn-outline-primary filter-btn" data-filter="active">Active</button>
                <button type="button" class="btn btn-outline-primary filter-btn" data-filter="completed">Completed</button>
            </div>

            <!-- Task List Container -->
            <ul class="list-group mb-3" id="taskList">
                <!-- Tasks will be dynamically added here -->
            </ul>

            <!-- Empty State Message -->
            <div id="emptyMessage" class="text-center text-muted py-3">
                No tasks yet. Add your first task!
            </div>

            <!-- Clear Completed Button -->
            <div class="text-end mt-2">
                <button class="btn btn-outline-danger btn-sm px-3" id="clearCompletedBtn">Clear Completed</button>
            </div>

        </div>
    </div>

    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
